# Move this file to .github/workflows/update-jobs.yml to enable daily job-board refresh.
name: Update jobs board
on:
  schedule:
    - cron: "0 14 * * *"   # daily 14:00 UTC
  workflow_dispatch:
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: python3 scripts/update_jobs.py
      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898333+github-actions[bot]@users.noreply.github.com"
          git add jobs.json jobs.js
          git diff --cached --quiet || git commit -m "chore: daily jobs refresh $(date -u +%F)"
          git push
